name: NotifBridge-macOS

options:
  bundleIdPrefix: com.shinvou
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N8YZB43954
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  NotifBridge:
    type: application
    platform: macOS
    sources:
      - path: NotifBridge
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinvou.NotifBridge.Mac
        INFOPLIST_FILE: NotifBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotifBridge/NotifBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
