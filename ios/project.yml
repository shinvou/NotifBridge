name: NotifBridge-iOS

options:
  bundleIdPrefix: com.shinvou
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.5"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "" # Set your Apple Developer team when building.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    GENERATE_INFOPLIST_FILE: NO

targets:
  NotifBridge:
    type: application
    platform: iOS
    sources:
      - path: NotifBridge
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinvou.NotifBridge
        INFOPLIST_FILE: NotifBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotifBridge/NotifBridge.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DataProviderExtension
      - target: TransportSecurityExtension
      - target: TransportAppExtension

  DataProviderExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: DataProviderExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinvou.NotifBridge.DataProvider
        INFOPLIST_FILE: DataProviderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DataProviderExtension/DataProviderExtension.entitlements
        PRODUCT_NAME: DataProviderExtension

  TransportSecurityExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: TransportSecurityExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../shared
      - path: AccessoryBLEWriter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinvou.NotifBridge.Security
        INFOPLIST_FILE: TransportSecurityExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TransportSecurityExtension/TransportSecurityExtension.entitlements
        PRODUCT_NAME: TransportSecurityExtension

  TransportAppExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: TransportAppExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../shared
      - path: AccessoryBLEWriter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinvou.NotifBridge.Transport
        INFOPLIST_FILE: TransportAppExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TransportAppExtension/TransportAppExtension.entitlements
        PRODUCT_NAME: TransportAppExtension

  NotifBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NotifBridgeUITests
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinvou.NotifBridgeUITests
        INFOPLIST_FILE: NotifBridgeUITests/Info.plist
        TEST_TARGET_NAME: NotifBridge
    dependencies:
      - target: NotifBridge

schemes:
  NotifBridge:
    build:
      targets:
        NotifBridge: all
        DataProviderExtension: all
        TransportSecurityExtension: all
        TransportAppExtension: all
        NotifBridgeUITests: all
    run:
      config: Debug
      executable: NotifBridge
    test:
      config: Debug
      targets:
        - NotifBridgeUITests
