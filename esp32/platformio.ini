[platformio]
default_envs = esp32dev
core_dir = ~/.platformio

[env:esp32dev]
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    ; Bump NimBLE host's mbuf pool so back-to-back indicate() calls don't
    ; silently drop when the BLE link's transmit queue backs up.
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=48
    -DCONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=64
